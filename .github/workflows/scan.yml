name: Mock Checkmarx Scan

on:
  push:
    branches:
      - main

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Checkmarx Scan Report
        run: |
          cat << 'EOF' > checkmarx_scan_report.json
          {
            "scanReport": {
              "projectName": "checkmark-demo",
              "scanId": "CX-MOCK-${{ github.run_id }}",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "language": "Java",
              "vulnerabilities": [
                {
                  "id": "CX-1001",
                  "severity": "High",
                  "category": "SQL Injection",
                  "file": "src/main/java/com/demo/VulnerableApp.java",
                  "line": 24,
                  "description": "The application constructs an SQL query using unvalidated user input.",
                  "recommendation": "Use parameterized queries or prepared statements."
                },
                {
                  "id": "CX-1002",
                  "severity": "Critical",
                  "category": "Hardcoded Credentials",
                  "file": "src/main/java/com/demo/VulnerableApp.java",
                  "line": 13,
                  "description": "Database password hardcoded in source code.",
                  "recommendation": "Store secrets securely using environment variables."
                },
                {
                  "id": "CX-1003",
                  "severity": "High",
                  "category": "Command Injection",
                  "file": "src/main/java/com/demo/VulnerableApp.java",
                  "line": 38,
                  "description": "Unsanitized user input is passed directly to Runtime.exec() allowing arbitrary OS commands.",
                  "recommendation": "Use ProcessBuilder and avoid executing shell commands with user input."
                }
              ]
            }
          }
          EOF

      - name: Upload Scan Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkmarx-report
          path: checkmarx_scan_report.json
